name: 장마감 수급 오실레이터

on:
  schedule:
    # 평일 18:30 KST = 09:30 UTC
    # 16시대에는 투자자별 수급이 아직 잠정치라 확정 반영(18시경) 이후로 잡는다
    - cron: "30 9 * * 1-5"
  workflow_dispatch:
    inputs:
      force_run:
        description: '주말/공휴일 무시하고 강제 발송'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: supply-close
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 한글 폰트 설치 (차트 라벨용)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
          fc-cache -f
          rm -rf ~/.cache/matplotlib

      - name: 패키지 설치
        run: pip install -r bot/requirements.txt

      - name: 수급 오실레이터 발송
        run: python bot/supply_close.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
