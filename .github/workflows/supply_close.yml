name: 장마감 수급 오실레이터

on:
  schedule:
    # 평일 16:10 KST = 07:10 UTC (장 마감 후 네이버 수급 데이터 반영 시점)
    - cron: "10 7 * * 1-5"
  workflow_dispatch:
    inputs:
      force_run:
        description: '주말/공휴일 무시하고 강제 발송'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: supply-close
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r bot/requirements.txt

      - name: 수급 오실레이터 발송
        run: python bot/supply_close.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
