name: 삼성전자 빈집전환 알림

on:
  # 스케줄 비활성 — 같은 18:30에 나가는 '장마감 수급 오실레이터'와 중복이다.
  # 오실레이터는 43종목을 백분위 구간으로 판정하고 삼성전자도 거기 포함된다
  # (2026-09-16 기준 삼성전자 🔵 빈집근접).
  # 게다가 이 알림은 빈집 조건이 유지되는 동안 매일 같은 내용을 반복 발송한다.
  # 전환 시점만 잡으려면 전날 상태를 저장해 바뀔 때만 보내도록 고쳐야 한다.
  # schedule:
  #   - cron: "30 9 * * 1-5"
  workflow_dispatch:  # 수동 실행은 유지

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run binzip check
        id: check
        run: python scripts/check_binzip_alert.py

      # 원래 Gmail로 보냈는데 GMAIL_USERNAME/GMAIL_PASSWORD 시크릿이 등록된 적이 없어
      # "Input required and not supplied: from"으로 실패했다.
      # 이 레포에 이미 있는 텔레그램 시크릿으로 보낸다(다른 알림과 같은 채널).
      - name: Send telegram alert
        if: steps.check.outputs.binzip == 'true'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=HTML" \
            -d "text=🏚️ <b>삼성전자 빈집전환 신호</b>%0A최근 5일 기관+외국인 순매수: <b>${{ steps.check.outputs.short5 }}억</b>%0A40일 누적 순매수: <b>${{ steps.check.outputs.long40 }}억</b>%0A%0A조건 충족%0A • 40일 누적 &lt; 0 (빈집) — 수급 바닥%0A • 최근 5일 &gt; 0 (전환) — 매수 유입 시작%0A%0A수급이 바닥에서 반등을 시작하는 패턴입니다. 매매 전 추가 확인 권장."
