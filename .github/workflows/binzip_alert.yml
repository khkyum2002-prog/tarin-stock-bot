name: 삼성전자 빈집전환 알림

on:
  schedule:
    # 평일 18:30 KST = 09:30 UTC. 16시대 투자자별 수급은 잠정치라 확정(18시경) 이후로 잡는다
    - cron: "30 9 * * 1-5"
  workflow_dispatch:  # 수동 실행 허용

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run binzip check
        id: check
        run: python scripts/check_binzip_alert.py

      # 원래 Gmail로 보냈는데 GMAIL_USERNAME/GMAIL_PASSWORD 시크릿이 등록된 적이 없어
      # "Input required and not supplied: from"으로 실패했다.
      # 이 레포에 이미 있는 텔레그램 시크릿으로 보낸다(다른 알림과 같은 채널).
      - name: Send telegram alert
        if: steps.check.outputs.binzip == 'true'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=HTML" \
            -d "text=🏚️ <b>삼성전자 빈집전환 신호</b>%0A최근 5일 기관+외국인 순매수: <b>${{ steps.check.outputs.short5 }}억</b>%0A40일 누적 순매수: <b>${{ steps.check.outputs.long40 }}억</b>%0A%0A조건 충족%0A • 40일 누적 &lt; 0 (빈집) — 수급 바닥%0A • 최근 5일 &gt; 0 (전환) — 매수 유입 시작%0A%0A수급이 바닥에서 반등을 시작하는 패턴입니다. 매매 전 추가 확인 권장."
